services:
  # ============================================================
  # PostgreSQL - 主数据库
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpassword}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # ============================================================
  # Redis - 缓存与会话存储
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # ============================================================
  # OpenSearch - 向量 + 全文检索引擎
  # ============================================================
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: rag-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9200 | grep -q 200"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - rag-network

  # ============================================================
  # Ollama - 本地大模型推理
  # ============================================================
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # 如果有 NVIDIA GPU，取消下面注释
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - rag-network

  # ============================================================
  # ClickHouse - Langfuse V2 分析数据库
  # ============================================================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: rag-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: chpassword
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # MinIO - S3 兼容对象存储 (Langfuse 事件存储)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: rag-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # ============================================================
  # Airflow PostgreSQL - Airflow 元数据库
  # ============================================================
  airflow-postgres:
    image: postgres:16-alpine
    container_name: rag-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - rag-network

  # ============================================================
  # Airflow - 工作流编排
  # ============================================================
  airflow-webserver:
    image: apache/airflow:2.9.1
    container_name: rag-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_started
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow_logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: >
      bash -c "
        airflow db init &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true &&
        airflow webserver
      "
    networks:
      - rag-network

  airflow-scheduler:
    image: apache/airflow:2.9.1
    container_name: rag-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_started
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow_logs:/opt/airflow/logs
    command: airflow scheduler
    networks:
      - rag-network

  # ============================================================
  # Langfuse - 可观测性平台
  # ============================================================
  langfuse:
    image: langfuse/langfuse:3
    container_name: rag-langfuse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:-ragpassword}@postgres:5432/${POSTGRES_DB:-ragdb}
      - NEXTAUTH_SECRET=${LANGFUSE_SECRET:-changeme}
      - SALT=${LANGFUSE_SALT:-changeme}
      - NEXTAUTH_URL=http://localhost:3000
      - CLICKHOUSE_URL=clickhouse://default:chpassword@clickhouse:9000/langfuse
      - CLICKHOUSE_MIGRATION_URL=clickhouse://default:chpassword@clickhouse:9000/langfuse
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=chpassword
      - CLICKHOUSE_DB=langfuse
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - TELEMETRY_ENABLED=false
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=us-east-1
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=minioadmin
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=minioadmin
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
    ports:
      - "3000:3000"
    networks:
      - rag-network

# ============================================================
# 数据卷
# ============================================================
volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  ollama_data:
  airflow_postgres_data:
  airflow_logs:
  clickhouse_data:
  minio_data:

# ============================================================
# 网络
# ============================================================
networks:
  rag-network:
    driver: bridge
