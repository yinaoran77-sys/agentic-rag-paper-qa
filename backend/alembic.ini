[alembic]
# Alembic config file
# Why INI format? Alembic tradition, deep integration with CLI tool

# Migration script location (relative to backend/ directory)
script_location = alembic

# Database async connection URL (asyncpg for run_async_migrations())
sqlalchemy.url = postgresql+asyncpg://raguser:ragpassword@localhost:5432/agentic_rag

# Log output
verbose = true

# Version number generation strategy: use timestamp prefix (avoid conflicts in team collaboration)
# Example: 20240609153000_create_documents_table.py
version_path_separator = colon

# Migration script naming template
# %%name%% is what you type in `alembic revision --message "xxx"`
file_template = %%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Tables to ignore (usually none)
# tables_to_exclude = spaider_calender

# ============================================================
# Log config (same format as Python logging module)
# ============================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = 
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = 
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %H:%M:%S
